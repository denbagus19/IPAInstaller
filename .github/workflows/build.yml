name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install xcodegen and ldid
        run: brew install xcodegen ldid

      - name: Generate Project
        working-directory: ./IPAInstaller
        run: xcodegen generate

      - name: Resolve Swift Packages
        working-directory: ./IPAInstaller
        run: xcodebuild -resolvePackageDependencies -project IPAInstaller.xcodeproj -scheme IPAInstaller

      - name: Build (No Code Signing)
        working-directory: ./IPAInstaller
        run: |
          xcodebuild \
            -project IPAInstaller.xcodeproj \
            -scheme IPAInstaller \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build | xcpretty || xcodebuild \
            -project IPAInstaller.xcodeproj \
            -scheme IPAInstaller \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Fake-sign with ldid
        working-directory: ./IPAInstaller
        run: |
          APP_PATH=$(find build/Build/Products -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then echo "App not found"; exit 1; fi
          echo "Found App at: $APP_PATH"
          
          # Debug: List contents of the .app folder
          echo "Contents of $APP_PATH:"
          ls -F "$APP_PATH"
          
          # Find the actual executable (usually the one without extension and same name as folder)
          APP_NAME=$(basename "$APP_PATH" .app)
          if [ -f "$APP_PATH/$APP_NAME" ]; then
            EXECUTABLE_PATH="$APP_PATH/$APP_NAME"
          else
            # Fallback: find any executable file
            EXECUTABLE_PATH=$(find "$APP_PATH" -maxdepth 1 -type f -not -name "*.*" | head -n 1)
          fi
          
          echo "Signing executable: $EXECUTABLE_PATH"
          ldid -S "$EXECUTABLE_PATH"
          echo "APP_DIR=$APP_PATH" >> $GITHUB_ENV

      - name: Package into IPA
        working-directory: ./IPAInstaller
        run: |
          mkdir -p Payload
          cp -r "${{ env.APP_DIR }}" Payload/
          zip -qr IPAInstaller.ipa Payload
          echo "IPA size: $(du -sh IPAInstaller.ipa | cut -f1)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPAInstaller-Unsigned
          path: IPAInstaller/IPAInstaller.ipa
          retention-days: 30

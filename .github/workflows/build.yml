name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install xcodegen and ldid
        run: brew install xcodegen ldid

      - name: Generate Project
        working-directory: ./IPAInstaller
        run: xcodegen generate

      - name: Resolve Swift Packages
        working-directory: ./IPAInstaller
        run: xcodebuild -resolvePackageDependencies -project IPAInstaller.xcodeproj -scheme IPAInstaller

      - name: Build (No Code Signing)
        working-directory: ./IPAInstaller
        run: |
          xcodebuild \
            -project IPAInstaller.xcodeproj \
            -scheme IPAInstaller \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build

      - name: Fake-sign with ldid
        working-directory: ./IPAInstaller
        run: |
          APP_PATH=$(find build/Build/Products -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then echo "App not found"; exit 1; fi
          echo "Found App at: $APP_PATH"
          
          # Debug: List contents of the .app folder
          ls -F "$APP_PATH"
          
          APP_NAME=$(basename "$APP_PATH" .app)
          if [ ! -f "$APP_PATH/$APP_NAME" ]; then
            echo "ERROR: Executable '$APP_NAME' NOT found in bundle!"
            echo "The build might have failed to produce the binary."
            exit 1
          fi
          
          ldid -S "$APP_PATH/$APP_NAME"
          echo "APP_DIR=$APP_PATH" >> $GITHUB_ENV

      - name: Package into IPA
        working-directory: ./IPAInstaller
        run: |
          mkdir -p Payload
          cp -r "${{ env.APP_DIR }}" Payload/
          zip -qr IPAInstaller.ipa Payload
          echo "IPA size: $(du -sh IPAInstaller.ipa | cut -f1)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPAInstaller-Unsigned
          path: IPAInstaller/IPAInstaller.ipa
          retention-days: 30

name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install xcodegen ldid

      - name: Generate Xcode Project
        working-directory: ./IPAInstaller
        run: |
          xcodegen generate

      - name: Build Xcode Project (Unsigned)
        working-directory: ./IPAInstaller
        run: |
          xcodebuild clean build \
            -project IPAInstaller.xcodeproj \
            -scheme IPAInstaller \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        working-directory: ./IPAInstaller
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/IPAInstaller.app Payload/
          ldid -S Payload/IPAInstaller.app
          zip -qr IPAInstaller.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPAInstaller-Unsigned
          path: IPAInstaller/IPAInstaller.ipa

name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install xcodegen ldid

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Xcode Project (Unsigned)
        run: |
          xcodebuild clean build \
            -project IPAInstaller.xcodeproj \
            -scheme IPAInstaller \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          # Create Payload directory
          mkdir Payload
          
          # Copy the built .app to Payload
          cp -r build/Build/Products/Release-iphoneos/IPAInstaller.app Payload/
          
          # Perform fake signing using ldid (required for some sideloading methods to recognize it properly)
          ldid -S Payload/IPAInstaller.app
          
          # Zip it into an .ipa file
          zip -qr IPAInstaller.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPAInstaller-Unsigned
          path: IPAInstaller.ipa
